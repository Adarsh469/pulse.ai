# ── Nginx production reverse proxy for ClinicalTriage-Env ────────────────────
# HTTP only. For HTTPS, copy nginx.ssl.conf over this file after Certbot issues certs.
# See DEPLOYMENT.md → "Enable HTTPS with Certbot" for step-by-step instructions.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── AWS ALB / CloudFront real-IP passthrough ───────────────────────────────
    # When traffic arrives via an AWS ALB, $remote_addr is the ALB's IP.
    # These directives restore the original client IP from X-Forwarded-For.
    # AWS ALB operates from the VPC CIDR range; 10.0.0.0/8 covers all common VPCs.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    # AWS CloudFront edge IPs (covers all current CloudFront ranges)
    set_real_ip_from  54.239.128.0/18;
    set_real_ip_from  204.246.164.0/22;
    set_real_ip_from  205.251.192.0/19;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Logging (real client IP after set_real_ip_from resolution)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    # Gzip compression (reduces bandwidth on EC2 egress costs)
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/javascript application/json application/xml
                      text/css text/plain text/xml image/svg+xml;

    # Proxy buffer tuning
    proxy_buffer_size        16k;
    proxy_buffers            4 32k;
    proxy_busy_buffers_size  64k;

    # ── Upstream services ─────────────────────────────────────────────────────
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:7860;
    }

    # ── Main server block ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ALB / ELB health check path — must respond 200 on /health for target group
        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # WebSocket upgrade support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ── /api/* → FastAPI backend (strip /api prefix) ──────────────────────
        location /api/ {
            proxy_pass         http://backend_upstream/;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── /docs, /redoc, /openapi.json → FastAPI docs ───────────────────────
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://backend_upstream;
        }

        # ── Everything else → Next.js frontend ───────────────────────────────
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
