# ── Nginx HTTPS config for ClinicalTriage-Env ────────────────────────────────
# USAGE: After Certbot has issued a certificate, replace nginx.conf with this file:
#   cp nginx/nginx.ssl.conf nginx/nginx.conf
#   docker compose exec nginx nginx -s reload
#
# Replace YOUR_DOMAIN with your actual domain (e.g. triage.example.com)

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── AWS ALB / CloudFront real-IP passthrough ───────────────────────────────
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  54.239.128.0/18;
    set_real_ip_from  204.246.164.0/22;
    set_real_ip_from  205.251.192.0/19;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/javascript application/json application/xml
                      text/css text/plain text/xml image/svg+xml;

    proxy_buffer_size        16k;
    proxy_buffers            4 32k;
    proxy_busy_buffers_size  64k;

    # ── Upstream services ─────────────────────────────────────────────────────
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:7860;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN;

        # Allow Certbot ACME challenge through
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN;
        http2 on;

        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

        # Modern SSL settings (TLS 1.2 + 1.3 only)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;

        # HSTS (6 months; uncomment only after confirming HTTPS works end-to-end)
        # add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

        # ALB / ELB health check endpoint
        location = /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # Certbot webroot for renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # /api/* → FastAPI backend (strip prefix)
        location /api/ {
            proxy_pass         http://backend_upstream/;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # FastAPI docs
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://backend_upstream;
        }

        # Everything else → Next.js frontend
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
